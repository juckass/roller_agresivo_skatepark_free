<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" width="340" height="140" role="img" aria-label="Cross Grind Chile">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1e3"/>
      <stop offset="1" stop-color="#d9cfb6"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e23b34"/>
      <stop offset="1" stop-color="#9e1c17"/>
    </linearGradient>
  </defs>

  <!-- salpicaduras negras -->
  <g fill="#0a0a0a">
    <circle cx="24" cy="28" r="7"/><circle cx="14" cy="46" r="4"/>
    <circle cx="315" cy="30" r="6"/><circle cx="326" cy="48" r="3.5"/>
    <circle cx="40" cy="118" r="5"/><circle cx="300" cy="115" r="6"/>
    <circle cx="170" cy="126" r="4"/><circle cx="120" cy="122" r="3"/>
  </g>

  <!-- badge oscuro -->
  <rect x="26" y="20" width="288" height="66" rx="8" fill="#141414" stroke="#2b2b2b" stroke-width="2"/>

  <!-- CROSS GRIND -->
  <text x="42" y="66" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#cream)" stroke="#0a0a0a" stroke-width="1.5" letter-spacing="1">CROSS</text>
  <text x="182" y="66" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#red)" stroke="#0a0a0a" stroke-width="1.5" letter-spacing="1">GRIND</text>

  <!-- banner CHILE -->
  <path d="M70 92 L270 92 L262 116 L78 116 Z" fill="url(#red)" stroke="#0a0a0a" stroke-width="2"/>
  <text x="170" y="110" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#f7f1e3" letter-spacing="9">CHILE</text>
</svg>
